
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17241f">
<title>Du und ich, Helga! – Weihnachtsrätsel</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: radial-gradient(circle at top, #294638, #101a18 70%);
  color: #f8f0dc;
  font-family: Georgia, serif;
}

.card {
  width: min(100%, 600px);
  padding: clamp(24px, 6vw, 44px);
  border: 1px solid #b99752;
  border-radius: 20px;
  background: #17241f;
  box-shadow: 0 20px 70px #0008;
  text-align: center;
}

.symbol {
  font-size: 42px;
}

h1 {
  color: #e9c777;
  font-size: clamp(27px, 6vw, 38px);
  line-height: 1.25;
}

p {
  font-size: 18px;
  line-height: 1.65;
}

.riddle {
  margin: 25px 0;
  padding: 20px;
  background: #ffffff0b;
  border-radius: 12px;
  font-size: 19px;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #b99752;
  border-radius: 9px;
  background: #101a18;
  color: white;
  font-size: 17px;
  text-align: center;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  border: 0;
  border-radius: 9px;
  background: #e9c777;
  color: #182019;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #f6dda0;
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid #f6dda0;
  outline-offset: 3px;
}

#feedback {
  min-height: 28px;
  color: #f5c7a9;
}

.small {
  font-size: 13px;
  color: #c9c2b1;
}

#stageImage {
  display: block;
  width: 100%;
  max-height: 360px;
  object-fit: contain;
  margin: 20px auto;
  border-radius: 12px;
}

#stageImage[hidden] {
  display: none;
}

.decoration {
  color: #e9c777;
  letter-spacing: 5px;
  font-size: 18px;
}

[hidden] {
  display: none !important;
}

</style>
</head>

<body>
<main class="card">

  <div class="decoration" aria-hidden="true">
    ✦ ❄ ✦
  </div>

  <div class="symbol" id="symbol">🎄</div>

  <h1 id="title">Du und ich, Helga!</h1>

  <p id="intro">
    Hallo liebe Helga! ❤️
    Du bist auf dem richtigen Weg. 
    Sieben Geheimnisse führen dich Schritt für Schritt
    zu deinem Weihnachtsgeschenk.
  </p>

  <div class="riddle" id="riddle">
    Bist du bereit, dich auf die Suche zu machen?
    Dann beginnt jetzt unser kleines Abenteuer!
  </div>

  <img
    id="stageImage"
    alt="Bild zum Rätsel"
    hidden
  >

  <button type="button" id="startButton">
    🎁 Abenteuer beginnen
  </button>

  <form id="codeForm" hidden>
    <label for="code" class="small">
      Gib den Geheimcode ein, um weiterzukommen.
    </label>

    <input
      id="code"
      type="text"
      autocomplete="off"
      placeholder="Geheimcode eingeben"
      aria-label="Geheimcode"
      required
    >

    <button type="submit" id="submit">
      Rätsel lösen
    </button>
  </form>

  <p id="feedback" role="status" aria-live="polite"></p>

  <p class="small" id="progress">
    Dein Weihnachtsabenteuer wartet
  </p>

</main>

<script>
const stages = [
  {
    

    title: "Kannst du dich noch erinnern, wo wir damals waren?",
    symbol: "🗝️",
    intro: "Gib unten den Ort ein, um auf die nächste Seite zu gelangen und merke dir den zweiten Buchstaben.",
    riddle: "Du benötigst ihn später für den Mini Cryptex",
    code: "MICHAELISMESSE",
    image: "IMG-20250829-WA0009.jpg",
    imageAlt: "Erinnerung an die Michaelismesse"
},

  },
  {
    title: "Irgendwann im Herbst, als du aus Spanien zurück warst",
    symbol: "🧭",
    intro: "Wohin führte uns unsere erste gemeinsame Wanderung?",
    riddle: "Merke dir wieder den zweiten Buchstaben",
    code: "ENGELBERG"
  },
  {
    title: "Frage Cervantes nach dem nächsten Code-Wort",
    symbol: "🌙",
    intro: "Du findest es im 43. Kapitel in einem Gedicht (Seite 501)",
    riddle: "Es steht im ersten Absatz, dritte Zeile, drittes Wort. Merke dir den ersten Buchstaben",
    code: "WOLKEN"
  },
  {
    title: "Jetzt bist du schon richtig weit!",
    symbol: "🗝️",
    intro: "Rufe jetzt Wesley an, wünsche den beiden frohe Weihnachten und frage nach dem vierten Codewort!",
    riddle: "Merke dir den dritten Buchstaben",
    code: "CHRISTBAUM"
  },
  {
    title: "Das nächste Codewort findest du, wenn du dich an unseren Urlaub erinnerst",
    symbol: "🔥",
    intro: "In Nerja lagen wir auf dem Liegestuhl, aber nicht am Pool, sondern immer am ...",
    riddle: "Merke dir den zweiten Buchstaben",
    code: "STRAND"
  },
  {
    title: "Ja liebe Helga, gleich kannst du den Mini Cryptex öffnen. Du brauchst nur noch ein Codewort",
    symbol: "🌊",
    intro: "Wer lag im Märchen auf der Erbse?",
    riddle: "Merke dir den sechsten Buchstaben. Bilde jetzt aus allen Buchstaben ein Wort und gib das Gegenteil davon in den Mini Cryptex ein",
    code: "PRINZESSIN"
  },
  {
    title: "Hast du das nächste Codewort schon gefunden?",
    symbol: "💎",
    intro: "Es befindet sich im Innern des Cryptex.",
    riddle: "Gib das Wort einfach hier noch ein, dann bekommst du dein Geschenk",
    code: "SPANIEN"
  }
];

// -1 bedeutet: Die Startseite wird angezeigt.
let current = -1;

const $ = id => document.getElementById(id);

function normalizeCode(value) {
  return value
    .trim()
    .toLocaleUpperCase("de-DE")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/ß/g, "SS")
    .replace(/[^A-Z0-9]/g, "");
}

function render() {
  const form = $("codeForm");
  const startButton = $("startButton");
  const image = $("stageImage");

  // Startseite
  if (current === -1) {
    $("symbol").textContent = "🎄";
    $("title").textContent = "Du und ich, Helga!";
    $("intro").textContent =
      "Hallo liebe Helga! ❤️ Es wartet ein ganz besonderes Abenteuer auf dich. Sieben Geheimnisse führen dich Schritt für Schritt zu deinem Weihnachtsgeschenk.";

    $("riddle").textContent =
      "Bist du bereit, dich auf die Suche zu machen? Dann beginnt jetzt unser kleines Abenteuer!";

    form.hidden = true;
    startButton.hidden = false;
    image.hidden = true;

    $("feedback").textContent = "";
    $("progress").textContent =
      "Dein Weihnachtsabenteuer wartet";

    return;
  }

  // Abschlussseite nach allen sieben Rätseln
  if (current >= stages.length) {
    $("symbol").textContent = "🏆";
    $("title").textContent = "Du hast es geschafft!";
    $("intro").textContent =
      "Alle sieben Geheimnisse sind gelöst. Du hast den Schatz gefunden! ❤️";

    $("riddle").textContent =
      "🎉 Herzlichen Glückwunsch, Rätselmeister! Hier wartet deine Belohnung: [Hier deine Überraschung eintragen.]";

    form.hidden = true;
    startButton.hidden = true;
    image.hidden = true;

    $("progress").textContent =
      "7 von 7 Rätseln gelöst";

    $("feedback").textContent = "";
    return;
  }

  // Aktuelles Rätsel anzeigen
  const stage = stages[current];

  $("symbol").textContent = stage.symbol || "🗝️";
  $("title").textContent = stage.title;
  $("intro").textContent = stage.intro;
  $("riddle").textContent = stage.riddle;

  // Optionales Bild für ein Rätsel
  if (stage.image) {
    image.src = stage.image;
    image.alt = stage.imageAlt || "Bild zum Rätsel";
    image.hidden = false;
  } else {
    image.removeAttribute("src");
    image.alt = "Bild zum Rätsel";
    image.hidden = true;
  }

  $("code").value = "";
  $("code").placeholder = "Geheimcode eingeben";

  $("submit").textContent =
    current === 0
      ? "Erstes Rätsel lösen"
      : "Nächstes Geheimnis öffnen";

  form.hidden = false;
  startButton.hidden = true;

  $("progress").textContent =
    "Rätsel " + (current + 1) + " von " + stages.length;

  $("feedback").textContent = "";

  $("code").focus();
}

// Startknopf
$("startButton").addEventListener("click", () => {
  current = 0;
  render();
});

// Geheimcode prüfen
$("codeForm").addEventListener("submit", event => {
  event.preventDefault();

  if (current < 0 || current >= stages.length) {
    return;
  }

  const entered = normalizeCode($("code").value);
  const expected = normalizeCode(stages[current].code);

  if (entered === expected) {
    current++;
    render();
  } else {
    $("feedback").textContent =
      "Das ist leider nicht der richtige Code. Versuche es noch einmal!";

    $("code").select();
  }
});

// Beim Öffnen zunächst die Startseite anzeigen
render();
</script>
</body>
</html>
